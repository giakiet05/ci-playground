name: pipeline

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

jobs: 
  pipeline: 
    uses: giakiet05/ci-templates/.github/workflows/service.yml@main
    with: 
      build-compose-file: compose.override.yaml
      deploy: none
    secrets: inherit