[project]
name = "ci-playground-worker"
version = "0.1.0"
description = "Tiny background worker used to exercise the shared CI template."
requires-python = ">=3.14"
dependencies = []

[tool.uv]
# An application, not a library: nothing to build or install.
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
